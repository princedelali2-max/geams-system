# nginx version. Get a certificate first:  certbot certonly --nginx -d geams.example.org
server {
    listen 80;
    server_name geams.example.org;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name geams.example.org;
    ssl_certificate     /etc/letsencrypt/live/geams.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geams.example.org/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # live updates
        proxy_read_timeout 120s;
    }
}
