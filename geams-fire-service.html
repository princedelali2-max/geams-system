<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GEAMS Fire Response — Ghana National Fire Service</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<script src="config.js"></script>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/geams-map.js"></script>
<style>
  :root{
    --bg:#0a0f14; --bg-raised:#111a22; --bg-deep:#070b0f;
    --red:#ef4444; --red-dim:rgba(239,68,68,0.12); --red-border:rgba(239,68,68,0.35);
    --orange:#fb923c; --gold:#e8b84b; --green:#4ade80; --cyan:#38bdf8;
    --text-primary:#f1f5f9; --text-muted:#8fa3b8; --text-ghost:#5e7a96;
    --border-base:#1e2b38; --border-mid:#2a3a4a;
    --r-sm:6px; --r-md:10px; --r-lg:16px;
    --font-mono:'SF Mono',Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;height:var(--app-h,100dvh);overflow:hidden}
  #app{height:100vh;height:var(--app-h,100dvh);display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative;background:var(--bg)}

  /* ── LOGIN ── */
  .login-wrap{flex:1;min-height:0;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;justify-content:flex-start;justify-content:safe center;padding:32px 24px;overflow-y:auto}
  .login-logo{font-size:1.8rem;font-weight:800;text-align:center;letter-spacing:1px;color:var(--red)}
  .login-sub{text-align:center;color:var(--text-muted);font-size:0.85rem;margin-top:4px;margin-bottom:24px}
  .login-security-bar{display:flex;align-items:center;gap:8px;background:var(--red-dim);border:1px solid var(--red-border);border-radius:var(--r-md);padding:8px 12px;margin-bottom:18px}
  .login-security-dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:blink 1.4s infinite}
  .login-security-txt{font-family:var(--font-mono);font-size:0.6rem;letter-spacing:1px;color:var(--red)}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
  .login-field{margin-bottom:14px}
  .login-label{display:block;font-size:0.7rem;font-weight:600;color:var(--text-muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px}
  .login-input{width:100%;background:var(--bg-raised);border:1px solid var(--border-mid);border-radius:var(--r-md);padding:11px 13px;color:var(--text-primary);font-size:0.88rem}
  .login-input:focus{outline:none;border-color:var(--red)}
  .login-input.error{border-color:var(--red)}
  .login-error{display:none;font-size:0.68rem;color:var(--red);margin-top:4px}
  .login-error.show{display:block}
  .login-btn{width:100%;background:var(--red);color:white;border:none;border-radius:var(--r-md);padding:13px;font-size:0.9rem;font-weight:700;cursor:pointer;margin-top:6px}
  .login-btn:disabled{opacity:0.5;cursor:not-allowed}
  .login-meta{display:flex;justify-content:center;gap:16px;margin-top:16px;font-size:0.72rem}
  .login-meta-link{color:var(--cyan);cursor:pointer}

  /* ── TOPBAR ── */
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border-base);flex-shrink:0;background:var(--bg-raised)}
  .topbar-logo{font-weight:800;font-size:0.95rem;color:var(--red)}
  .topbar-dot{width:8px;height:8px;border-radius:50%;background:var(--text-ghost)}
  .topbar-dot.busy{background:var(--red);animation:blink 1.4s infinite}
  .topbar-crew{font-size:0.7rem;color:var(--text-muted);margin-left:auto}
  .topbar-btn{background:none;border:none;color:var(--text-muted);font-size:1rem;cursor:pointer;padding:4px 6px}

  /* ── SCREENS ── */
  .screen{display:none;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex-direction:column}
  .screen.active{display:flex}

  .empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;color:var(--text-muted)}
  .empty-state-icon{font-size:2.6rem;margin-bottom:12px;opacity:0.6}

  .call-card{margin:14px;background:var(--bg-raised);border:1px solid var(--red-border);border-radius:var(--r-lg);padding:16px;animation:pulseCard 2s infinite}
  @keyframes pulseCard{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.25)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
  .call-card-type{font-size:1.05rem;font-weight:800;color:var(--red)}
  .call-card-meta{font-size:0.76rem;color:var(--text-muted);margin-top:4px;line-height:1.6}
  .call-card-actions{display:flex;gap:8px;margin-top:14px}
  .btn{border:none;border-radius:var(--r-md);padding:10px 14px;font-size:0.8rem;font-weight:700;cursor:pointer}
  .btn-full{flex:1}
  .btn-primary{background:var(--red);color:white}
  .btn-ghost{background:var(--bg-deep);color:var(--text-muted);border:1px solid var(--border-mid)}
  .btn-success{background:var(--green);color:#052e16}
  .btn-warning{background:var(--orange);color:#431407}
  .btn-cyan{background:var(--cyan);color:#082f49}
  .btn-sm{padding:7px 10px;font-size:0.72rem}
  .btn:disabled{opacity:0.5;cursor:not-allowed}

  .queue-item{margin:0 14px 10px;background:var(--bg-raised);border:1px solid var(--border-base);border-radius:var(--r-md);padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
  .queue-item-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 14px 14px}
  .stat-box{background:var(--bg-raised);border:1px solid var(--border-base);border-radius:var(--r-md);padding:10px 6px;text-align:center}
  .stat-val{font-size:1.1rem;font-weight:800;font-family:var(--font-mono)}
  .stat-key{font-size:0.58rem;color:var(--text-ghost);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px}

  #incident-map{width:100%;height:280px;flex-shrink:0}
  .action-bar{display:flex;gap:8px;padding:14px}
  .job-detail{padding:14px}
  .job-detail-row{font-size:0.8rem;color:var(--text-muted);margin-bottom:6px;line-height:1.5}
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:9999;background:var(--bg-raised);border:1px solid var(--border-mid);border-radius:var(--r-md);padding:11px 16px;font-size:0.8rem;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,0.5);display:flex;gap:8px;align-items:flex-start}
  .toast.success{border-color:var(--green)} .toast.error{border-color:var(--red)}
  .toast.warning{border-color:var(--orange)} .toast.info{border-color:var(--cyan)}
  .nav-tabs{display:flex;border-top:1px solid var(--border-base);background:var(--bg-raised);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .nav-tab{flex:1;text-align:center;padding:9px 4px;font-size:0.62rem;color:var(--text-ghost);cursor:pointer}
  .nav-tab.active{color:var(--red)}
  .nav-tab-icon{font-size:1.1rem;display:block}
</style>
<script>/* keep the app exactly as tall as the VISIBLE screen (phone browsers' 100vh includes the hidden address bar, which pushed the bottom tabs off-screen) */
(function(){function s(){var h=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;document.documentElement.style.setProperty('--app-h',Math.round(h)+'px');}s();window.addEventListener('resize',s);window.addEventListener('orientationchange',function(){setTimeout(s,250);});if(window.visualViewport){window.visualViewport.addEventListener('resize',s);}})();
</script>
</head>
<body>
<div id="app">

  <!-- LOGIN -->
  <div class="login-wrap" id="login-view">
    <div class="login-logo">🚒 GEAMS FIRE</div>
    <div class="login-sub">Ghana National Fire Service — Response Terminal</div>
    <div class="login-security-bar"><div class="login-security-dot"></div><div class="login-security-txt">SECURE CHANNEL · CREW LOGIN REQUIRED</div></div>

    <div class="login-field">
      <label class="login-label" for="login-name">Firefighter Name</label>
      <input class="login-input" id="login-name" type="text" placeholder="Your full name as registered" autocomplete="username">
      <div class="login-error" id="err-name">Name is required</div>
    </div>
    <div class="login-field">
      <label class="login-label" for="login-pass">Password</label>
      <input class="login-input" id="login-pass" type="password" placeholder="Enter password" autocomplete="current-password">
      <div class="login-error" id="err-pass">Password is required</div>
    </div>
    <div class="login-error" id="err-general" style="text-align:center;margin-top:6px"></div>
    <button class="login-btn" id="login-btn" onclick="FireApp.doLogin()">🔐 Sign In</button>
    <div class="login-meta">
      <span class="login-meta-link" onclick="FireApp.showSignup()">👨‍🚒 New crew member? Register</span>
    </div>
  </div>

  <!-- SIGNUP -->
  <div class="login-wrap" id="signup-view" style="display:none">
    <div class="login-logo">🚒 GEAMS FIRE</div>
    <div class="login-sub">Crew Registration</div>
    <div class="login-field"><label class="login-label">Full Name</label>
      <input class="login-input" id="su-name" placeholder="e.g. FO J. Owusu"></div>
    <div class="login-field"><label class="login-label">Rank</label>
      <select class="login-input" id="su-rank">
        <option>Firefighter</option><option>Fire Officer (FO)</option>
        <option>Station Officer</option><option>Assistant Divisional Officer</option>
      </select></div>
    <div class="login-field"><label class="login-label">Phone</label>
      <input class="login-input" id="su-phone" placeholder="+233-24-0000000"></div>
    <div class="login-field"><label class="login-label">Engine / Unit Number</label>
      <input class="login-input" id="su-vehicle" placeholder="e.g. Engine 12"></div>
    <div class="login-field"><label class="login-label">Assigned Jurisdiction (LCR coverage area)</label>
      <select class="login-input" id="su-lcr"><!-- populated by JS from STATION_DIRECTORY --></select></div>
    <div class="login-field"><label class="login-label">Create Password</label>
      <input class="login-input" id="su-pass" type="password" placeholder="At least 6 characters"></div>
    <div class="login-field"><label class="login-label">Confirm Password</label>
      <input class="login-input" id="su-pass2" type="password" placeholder="Re-enter password"></div>
    <div class="login-error" id="su-err-general" style="text-align:center;margin-top:6px"></div>
    <button class="login-btn" id="signup-btn" onclick="FireApp.doSignup()">👨‍🚒 Register &amp; Sign In</button>
    <div class="login-meta"><span class="login-meta-link" onclick="FireApp.showLogin()">← Back to Sign In</span></div>
  </div>

  <!-- MAIN APP -->
  <div id="main-view" style="display:none;flex:1;flex-direction:column;overflow:hidden">
    <div class="topbar">
      <span class="topbar-logo">🚒 FIRE</span>
      <span class="topbar-dot" id="topbar-dot"></span>
      <span class="topbar-crew" id="topbar-crew"></span>
      <button class="topbar-btn" onclick="CrewPw.open({})" title="Change password">🔑</button>
      <button class="topbar-btn" onclick="GeamsRoster.open()" title="My availability" aria-label="My availability">🕑</button>
      <button class="topbar-btn" onclick="Feedback.open('fire',false)" title="Send feedback">💬</button>
      <button class="topbar-btn" onclick="FireApp.endShift()" title="End Shift">⏻</button>
    </div>

    <div class="screen active" id="screen-queue"></div>
    <div class="screen" id="screen-job"></div>
    <div class="screen" id="screen-aid"></div>

    <div class="nav-tabs">
      <div class="nav-tab active" data-screen="queue" onclick="FireApp.navigate('queue')"><span class="nav-tab-icon">📋</span>Calls</div>
      <div class="nav-tab" data-screen="job" onclick="FireApp.navigate('job')"><span class="nav-tab-icon">🗺</span>Active Response</div>
      <div class="nav-tab" data-screen="aid" onclick="FireApp.navigate('aid')"><span class="nav-tab-icon">🤝</span>Mutual Aid<span id="aid-badge" style="display:none;background:var(--red);color:#fff;border-radius:8px;font-size:0.55rem;padding:1px 5px;margin-left:3px;font-weight:700"></span></div>
    </div>
  </div>

  <div id="toast-container"></div>
</div>

<script>
/* ============================================================
   GEAMS SYNC — shared real-time layer (same implementation as the
   other GEAMS apps — window.storage when run as a Claude artifact,
   localStorage when served via geams-static-server.js).
   ============================================================ */
const GeamsSync = (() => {
  const LS_PREFIX = 'geams:';
  const APP = 'FIRE';
  let mode = 'checking';
  let base = '';                       // backend URL ('' = same origin)
  let online = false;                  // last backend request succeeded
  let status = { devices: 0, byApp: {} };
  const statusCbs = new Set();
  const keyCbs = new Set();
  let es = null;

  const deviceId = (() => {
    try { let d = sessionStorage.getItem('geams_device'); if (!d) { d = APP + '-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); sessionStorage.setItem('geams_device', d); } return d; }
    catch (e) { return APP + '-' + Math.random().toString(36).slice(2, 10); }
  })();

  function artifactAvailable() { return typeof window !== 'undefined' && !!window.storage; }
  function localStorageAvailable() {
    try { const k = '__geams_probe__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
    catch (e) { return false; }
  }
  // ── sign-in token: issued by the GEAMS server at login, sent with every request ──
  let tokenMem = null; const authCbs = new Set();
  function authToken() { try { return sessionStorage.getItem('geams_token') || sessionStorage.getItem('geams_hq_token') || tokenMem; } catch (e) { return tokenMem; } }
  function setToken(t) { tokenMem = t || null; try { if (t) sessionStorage.setItem('geams_token', t); else { sessionStorage.removeItem('geams_token'); sessionStorage.removeItem('geams_hq_token'); } } catch (e) {} }
  function onAuthLost(cb) { authCbs.add(cb); return () => authCbs.delete(cb); }
  async function http(path, opts, ms) {
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const t = ctl ? setTimeout(() => ctl.abort(), ms || 6000) : null;
    try {
      const tk = authToken();
      if (tk && !(opts && opts.headers && opts.headers.Authorization)) opts = Object.assign({}, opts, { headers: Object.assign({}, opts && opts.headers, { Authorization: 'Bearer ' + tk }) });
      const r = await fetch(base + path, Object.assign({ cache: 'no-store', signal: ctl && ctl.signal }, opts || {}));
      online = true;
      if (r.status === 401 && tk && path.indexOf('/api/kv/') === 0) { authCbs.forEach(cb => { try { cb(); } catch (e) {} }); }
      if (r.status === 503 && tk && /^\/api\/(kv|blob|blobs)\//.test(path) && !(opts && (!opts.method || opts.method === 'GET'))) {
        // HQ lockdown: say so plainly, so a crew does not think their update was sent
        try {
          let b = document.getElementById('lockdown-refused'); if (!b) { b = document.createElement('div'); b.id = 'lockdown-refused'; b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#b3261e;color:#fff;font:600 13px/1.4 system-ui,sans-serif;padding:10px 14px;text-align:center'; document.body.appendChild(b); }
          b.textContent = '🔒 HQ has paused all changes (lockdown). Your last update was NOT sent. Call your control room.'; b.style.display = 'block';
          clearTimeout(b._t); b._t = setTimeout(() => { b.style.display = 'none'; }, 20000);
        } catch (e) {}
      }
      return r;
    } catch (e) { online = false; throw e; }
    finally { if (t) clearTimeout(t); }
  }
  async function probe(url) {
    try {
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 3000);
      const r = await fetch(url + '/api/health', { cache: 'no-store', signal: ctl.signal }); clearTimeout(t);
      if (!r.ok) return false; const j = await r.json(); return !!(j && j.ok);
    } catch (e) { return false; }
  }
  function emitStatus() { statusCbs.forEach(cb => { try { cb(status, online); } catch (e) {} }); }
  async function sendPresence() {
    try {
      const r = await http('/api/ping?d=' + encodeURIComponent(deviceId) + '&a=' + encodeURIComponent(APP) + '&t=' + Date.now(), {}, 5000);
      const j = await r.json(); if (typeof j.devices !== 'number') throw new Error('old server');
      status = { devices: j.devices, byApp: j.byApp || {}, err: '' };
    } catch (e) { status = Object.assign({}, status, { err: 'presence failed — is the latest geams-server.js deployed?' }); }
    emitStatus();
  }
  function startEvents() {
    if (typeof EventSource === 'undefined') return;
    try {
      es = new EventSource(base + '/api/events');
      es.onmessage = (ev) => { try { const m = JSON.parse(ev.data); keyCbs.forEach(cb => cb(m.key)); } catch (e) {} };
      es.onopen = () => { online = true; keyCbs.forEach(cb => cb(null)); emitStatus(); };
      es.onerror = () => { online = false; emitStatus(); };
    } catch (e) {}
  }

  const ready = (async () => {
    let want = null;
    try {
      const q = new URLSearchParams(location.search).get('backend');
      if (q === 'local') localStorage.removeItem('geams_backend');
      else if (q) localStorage.setItem('geams_backend', q.replace(/\/+$/, ''));
      want = localStorage.getItem('geams_backend');
    } catch (e) {}
    const cands = [];
    if (want) cands.push(want);
    if (typeof location !== 'undefined' && /^https?:$/.test(location.protocol)) cands.push('');
    for (const c of cands) {
      if (await probe(c)) {
        base = c; mode = 'server'; online = true;
        startEvents(); sendPresence(); setInterval(sendPresence, 8000);
        return;
      }
    }
    if (artifactAvailable()) { mode = 'artifact'; return; }
    if (localStorageAvailable()) { mode = 'localStorage'; return; }
    mode = 'offline';
  })();

  function available() { return mode === 'artifact' || mode === 'localStorage' || mode === 'server'; }

  async function srvGet(key) {
    const r = await http('/api/kv/' + encodeURIComponent(key));
    return await r.json();
  }
  async function getShared(key, fallback) {
    await ready;
    if (mode === 'server') {
      try { const j = await srvGet(key); return j.found ? j.value : fallback; } catch (e) { return fallback; }
    }
    if (mode === 'artifact') {
      try { const r = await window.storage.get(key, true); return r && r.value !== undefined ? JSON.parse(r.value) : fallback; }
      catch (e) { return fallback; }
    }
    if (mode === 'localStorage') {
      try { const raw = localStorage.getItem(LS_PREFIX + key); return raw !== null ? JSON.parse(raw) : fallback; }
      catch (e) { return fallback; }
    }
    return fallback;
  }
  async function setShared(key, value) {
    await ready;
    if (mode === 'server') {
      try {
        const r = await http('/api/kv/' + encodeURIComponent(key), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ value }) });
        return r.ok;
      } catch (e) { return false; }
    }
    if (mode === 'artifact') {
      try { await window.storage.set(key, JSON.stringify(value), true); return true; } catch (e) { return false; }
    }
    if (mode === 'localStorage') {
      try { localStorage.setItem(LS_PREFIX + key, JSON.stringify(value)); return true; } catch (e) { return false; }
    }
    return false;
  }
  let lastFail = null;
  async function mergeShared(key, fallback, patchFn) {
    await ready;
    if (mode === 'offline') return false;
    if (mode === 'server') {
      // compare-and-set loop so two devices writing at once never overwrite each other
      for (let i = 0; i < 40; i++) {
        try {
          const j = await srvGet(key);
          const next = patchFn(j.found ? j.value : fallback);
          const r = await http('/api/kv/' + encodeURIComponent(key), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ value: next, ifVersion: j.v }) });
          if (r.ok) { lastFail = null; return true; }
          if (r.status !== 409) { lastFail = (r.status === 503 || r.status === 429 || r.status >= 500) ? 'busy' : 'refused'; return false; }
          await new Promise(res => setTimeout(res, 10 + Math.random() * 60 * (i + 1)));
        } catch (e) { lastFail = 'network'; return false; }
      }
      lastFail = 'busy'; return false;
    }
    try { const cur = await getShared(key, fallback); const next = patchFn(cur); await setShared(key, next); return true; }
    catch (e) { return false; }
  }

  /* ── Outbox: updates made with no signal are kept on this phone and sent when the connection returns ── */
  const OUTQ = 'geams_outq', outCbs = new Set();
  let outBusy = false, outDropped = 0;
  function outLoad() { try { const a = JSON.parse(localStorage.getItem(OUTQ) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
  function outSave(a) { try { localStorage.setItem(OUTQ, JSON.stringify(a.slice(-200))); } catch (e) {} outCbs.forEach(cb => { try { cb(a.length); } catch (e) {} }); outPill(a.length); }
  function outPill(n) {
    try {
      let el = document.getElementById('geams-outbox');
      if (!n) { if (el) el.style.display = 'none'; return; }
      if (!el) { el = document.createElement('div'); el.id = 'geams-outbox'; el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:74px;z-index:99998;background:#7a4b00;color:#fff;border:1px solid #fbbf24;border-radius:20px;padding:6px 14px;font:600 12px system-ui,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.5)'; document.body.appendChild(el); }
      el.style.display = 'block'; el.textContent = '⏳ ' + n + ' update' + (n === 1 ? '' : 's') + ' saved on this phone. Sending when the signal returns.';
    } catch (e) {}
  }
  const applyOp = (op) => (m) => {
    if (op.kind === 'append') { const arr = Array.isArray(m) ? m : []; arr.push(op.entry); return arr.length > 4000 ? arr.slice(-4000) : arr; }
    m = m || {}; if (!m[op.id]) return m; Object.keys(op.patch).forEach(k => { if (op.patch[k] !== undefined) m[op.id][k] = op.patch[k]; }); return m;
  };
  async function outFlush() {
    if (outBusy) return; outBusy = true;
    try {
      let q = outLoad();
      while (q.length) {
        const op = q[0], ok = await mergeShared(op.key, op.kind === 'append' ? [] : {}, applyOp(op));
        if (ok) { q.shift(); outSave(q); continue; }

/* ============================================================

const FireApp = (() => {

  /* ── TOASTS ── */

  /* ── LOGIN / SIGNUP ── */

      let cred = null, why = '';

  async function doSignup() {
    const name  = (document.getElementById('su-name')?.value || '').trim();

  function enterApp(cred) {

    document.getElementById('signup-view').style.display = 'none';
    document.getElementById('main-view').style.display = 'flex';

    GeamsFireSync.start(cred.lcrId);

  }

  function endShift() {
    if (FireData.currentJob && FireData.currentJob.status !== 'complete') {
      showToast('warning', 'Active Response', 'Complete or hand off your current call before ending shift', 5000);
      return;
    }
    GeamsSync.setToken(null);

  }

  /* ── NAVIGATION ── */
  function navigate(screen) {
    currentScreen = screen;
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.screen === screen));
    document.getElementById('screen-queue').classList.toggle('active', screen === 'queue');
    document.getElementById('screen-job').classList.toggle('active', screen === 'job');
    document.getElementById('screen-aid').classList.toggle('active', screen === 'aid');
    if (screen === 'queue') renderQueue();
    if (screen === 'job') renderJob();
    if (screen === 'aid') renderMutualAid();
  }

  /* ── INCOMING QUEUE ── */
  function onNewCall(rec) {
    queue.unshift(rec);
    const dot = document.getElementById('topbar-dot');
    if (dot) dot.classList.add('busy');
    showToast('error', '🚨 New Call — ' + rec.priority.toUpperCase(), `${rec.type} · ${rec.location}`, 7000);
    if (currentScreen === 'queue') renderQueue();
  }

  function renderQueue() {
    const el = document.getElementById('screen-queue');
    if (!el) return;
    if (FireData.currentJob && FireData.currentJob.status !== 'complete') {
      el.innerHTML = `<div class="empty-state">
        <div class="empty-state-icon">🚒</div>
        <div style="font-weight:700;margin-bottom:6px">Active response in progress</div>
        <div style="font-size:0.78rem">Go to "Active Response" to manage ${FireData.currentJob.id}</div>
      </div>`;
      return;
    }
    if (!queue.length) {
      el.innerHTML = `<div class="empty-state">
        <div class="empty-state-icon">📡</div>
        <div style="font-weight:700;margin-bottom:6px">Standing by</div>
        <div style="font-size:0.78rem">Listening for calls forwarded by your Local Control Room in real time</div>
      </div>`;
      return;
    }
    el.innerHTML = queue.map(rec => {
      const color = rec.priority === 'critical' ? 'var(--red)' : rec.priority === 'high' ? 'var(--orange)' : 'var(--gold)';
      return `<div class="call-card" style="border-color:${color}">
        <div class="call-card-type" style="color:${color}">${rec.type}</div>
        <div class="call-card-meta">
          📍 ${rec.location}<br>
          🧭 GPS: ${rec.lat?.toFixed(5)}, ${rec.lng?.toFixed(5)}<br>
          ${rec.civilianName ? '👤 Reported by: ' + rec.civilianName + (rec.civilianPhone ? ' · ' + rec.civilianPhone : '') + '<br>' : ''}
          ${rec.notes ? '📝 ' + rec.notes + '<br>' : ''}

          <button class="btn btn-primary btn-full" onclick="FireApp.acceptCall('${rec.id}')">🚒 Respond</button>
        </div>
      </div>`;
    }).join('');
  }

  function acceptCall(incId) {
    const rec = queue.find(r => r.id === incId);
    if (!rec) return;
    queue = queue.filter(r => r.id !== incId);
    const crew = FireData.crew;
    const station = FireData.findStation(crew.lcrId);
    const job = {
      id: rec.id, type: rec.type, priority: rec.priority, location: rec.location,
      lat: rec.lat, lng: rec.lng, civilianName: rec.civilianName, civilianPhone: rec.civilianPhone,
      notes: rec.notes, status: 'accepted', acceptedAt: Date.now(),
      unitLat: station.lat, unitLng: station.lng, unitETA: null,
    };
    FireData.setCurrentJob(job);
    GeamsFireSync.pushUpdate(crew.lcrId, incId, {
      serviceStatus: 'accepted', unitName: crew.name, unitBadge: crew.badge,
      unitLat: station.lat, unitLng: station.lng,
    });
    const dot = document.getElementById('topbar-dot');
    if (dot) dot.classList.remove('busy');
    showToast('success', 'Call Accepted', `${job.type} — navigating from ${station.name}`, 5000);
    navigate('job');
    startRoute(station, job);
  }

  /* ── ACTIVE RESPONSE / MAP ── */
  // Real positioning: the unit's position comes from this device's GPS
  // (watchPosition) while the call is En Route; ETA is computed from the real
  // remaining distance. Nothing is animated or simulated.
  let gpsWatch = null;
  function distM(aLat, aLng, bLat, bLng) {
    const R = 6371000, r = Math.PI/180, dLa = (bLat-aLat)*r, dLo = (bLng-aLng)*r;

    gpsWatch = null; if (hbTimer) { clearInterval(hbTimer); hbTimer = null; } lastFix = null;
  }
  /* ── LIVE POSITION AND ETA ──
   * Position is this device's real GPS. ETA is the remaining ROAD time when the routing service answers (re-fetched every ~15 s or when the unit
   * has moved), otherwise a straight-line estimate with a detour allowance, and the app says which one it is using. A heartbeat re-sends the fix every
   * 10 s even when the vehicle is stationary, and the server stamps when each position arrived, so the HQ can see how old it is. */
  let lastFix = null, hbTimer = null;
  const road = { at: 0, fromLat: null, fromLng: null, toLat: null, toLng: null, durS: null, distM: null, pts: [], pending: false, failAt: 0 };
  function legTarget(job) { return { lat: job.lat, lng: job.lng, name: 'the scene', kind: 'scene' }; }
  function roadFresh(t) { return road.distM != null && Date.now() - road.at < 60000 && distM(road.toLat, road.toLng, t.lat, t.lng) < 80; }
  async function fetchRoad(lat, lng, t) {
    const now = Date.now(); if (road.pending || now - road.failAt < 30000) return;
    const movedFrom = road.fromLat == null ? 1e9 : distM(road.fromLat, road.fromLng, lat, lng), movedTo = road.toLat == null ? 1e9 : distM(road.toLat, road.toLng, t.lat, t.lng);
    if (now - road.at < 15000 || (movedFrom < 30 && movedTo < 30 && now - road.at < 45000)) return;
    road.pending = true; const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 7000);
    try {
      const url = `${((window.GEAMS_CONFIG || {}).routeUrl || 'https://router.project-osrm.org')}/route/v1/driving/${lng},${lat};${t.lng},${t.lat}?overview=full&geometries=geojson`;
      const r = await fetch(url, { signal: ctl.signal }), j = await r.json(); if (!j.routes || !j.routes[0]) throw new Error('no route');
      const rt = j.routes[0]; road.pts = rt.geometry.coordinates.map(c => [c[1], c[0]]); road.distM = rt.distance; road.durS = rt.duration; road.at = Date.now(); road.fromLat = lat; road.fromLng = lng; road.toLat = t.lat; road.toLng = t.lng; road.failAt = 0;
    } catch (e) { road.failAt = Date.now(); } finally { clearTimeout(to); road.pending = false; }
  }
  function etaFor(lat, lng, speed, t) {
    const straight = distM(lat, lng, t.lat, t.lng);
    if (roadFresh(t)) { const rem = Math.max(straight, road.distM - distM(road.fromLat, road.fromLng, lat, lng)); return { min: Math.max(0, Math.round((road.durS * rem / road.distM) / 60)), src: 'road', km: rem / 1000 }; }
    const v = (speed && speed > 2) ? speed : 30 / 3.6; return { min: Math.max(0, Math.round((straight * 1.3) / v / 60)), src: 'straight-line', km: straight * 1.3 / 1000 };
  }
  function reportFix(fix) {
    const cj = FireData.currentJob; if (!cj || cj.status !== 'en_route') return;
    const t = legTarget(cj); if (t.lat == null || t.lng == null) return;
    fetchRoad(fix.lat, fix.lng, t);
    const e = etaFor(fix.lat, fix.lng, fix.speed, t);
    cj.unitLat = fix.lat; cj.unitLng = fix.lng; cj.unitETA = e.min; cj.etaSrc = e.src; cj.etaKm = e.km;
    GeamsFireSync.pushUpdate(FireData.crew.lcrId, cj.id, { unitLat: fix.lat, unitLng: fix.lng, unitETA: e.min, etaSource: e.src, etaTarget: t.kind, etaKm: Math.round(e.km * 10) / 10, unitAt: Date.now(), gpsAcc: fix.acc != null ? Math.round(fix.acc) : null });
    if (cj.mutualAidRequestId) FireMutualAid.pushUnitUpdate(cj.mutualAidRequestId, { unitLat: fix.lat, unitLng: fix.lng, unitETA: e.min });
    if (unitMarker) unitMarker.setLatLng([fix.lat, fix.lng]);
    if (routeLine) routeLine.setLatLngs(roadFresh(t) ? [[fix.lat, fix.lng], ...road.pts, [t.lat, t.lng]] : [[fix.lat, fix.lng], [t.lat, t.lng]]);
    if (currentScreen === 'job') updateStatBar();
    if (distM(fix.lat, fix.lng, t.lat, t.lng) < 50 && !cj._arrivalToasted) { cj._arrivalToasted = true; showToast('info', 'Arriving', 'You are within 50 m of the scene — mark On Scene', 5000); }
  }
  function startRoute(station, job) {
    routeCoords = [[station.lat, station.lng], [job.lat, job.lng]];
    routeStep = 0;
    if (routeTimer) { clearInterval(routeTimer); routeTimer = null; }
    stopGps();
    if (!navigator.geolocation) {
      showToast('error', 'GPS unavailable', 'This device has no geolocation — your position cannot be shared with the Control Room or HQ', 7000);
      return;
    }
    let warned = false;
    gpsWatch = navigator.geolocation.watchPosition((pos) => {
      const cj = FireData.currentJob;
      if (!cj || cj.status === 'complete') { stopGps(); return; }
      lastFix = { lat: pos.coords.latitude, lng: pos.coords.longitude, speed: pos.coords.speed, acc: pos.coords.accuracy };
      reportFix(lastFix);
    }, (err) => {
      if (warned) return; warned = true;
      showToast('warning', 'GPS', err && err.code === 1 ? 'Location permission is blocked — allow it so the Control Room and HQ can see your real position.' : 'No GPS fix yet — still trying.', 7000);
    }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
    hbTimer = setInterval(() => { if (lastFix) reportFix(lastFix); }, 10000);
  }

  function setStatus(status) {
    const job = FireData.currentJob;
    if (!job) return;
    job.status = status;
    GeamsFireSync.pushUpdate(FireData.crew.lcrId, job.id, { serviceStatus: status });
    const labels = { en_route:'En Route', on_scene:'On Scene', complete:'Call Complete' };
    showToast('success', labels[status] || status, job.id, 4000);
    if (status === 'complete') {
      if (routeTimer) { clearInterval(routeTimer); routeTimer = null; }
      stopGps();
      if (job.mutualAidRequestId) FireMutualAid.markComplete(job.mutualAidRequestId);
      FireData.setCurrentJob(null);
      setTimeout(() => navigate('queue'), 800);
      return;
    }
    if (status === 'en_route' && lastFix) reportFix(lastFix);
    renderJob();
  }

  /* ── MUTUAL AID (cross-jurisdiction backup) ── */
  let aidPickerOpen = false;

  function toggleAidPicker() {
    aidPickerOpen = !aidPickerOpen;
    renderJob();
  }

  function requestMutualAid(targetLcrId) {
    const job = FireData.currentJob;
    const crew = FireData.crew;
    if (!job || !crew) return;
    const target = FireData.nearbyStations(crew.lcrId).find(s => s.id === targetLcrId);
    const originStation = FireData.findStation(crew.lcrId);
    if (!target || !originStation) { showToast('error', 'Failed', 'Target station not found'); return; }
    const existing = FireMutualAid.recordForIncident(job.id);
    if (existing && existing.status === 'pending') {
      showToast('warning', 'Already Requested', `Awaiting response from ${existing.targetStationName}`);
      return;
    }
    const rec = FireMutualAid.sendRequest(job, target, originStation, crew);
    job.mutualAidOutgoingId = rec.id;
    aidPickerOpen = false;
    showToast('success', 'Backup Requested', `${target.name} notified (${target.distanceKm.toFixed(1)} km away) — awaiting response`, 6000);
    renderJob();
  }

  function cancelMutualAidRequest(requestId) {
    FireMutualAid.cancelRequest(requestId);
    showToast('info', 'Request Cancelled', 'The backup request has been withdrawn');
    renderJob();
    renderMutualAid();
  }

  function acceptMutualAid(requestId) {
    const rec = FireMutualAid.recordFor(requestId);
    if (!rec || rec.status !== 'pending') { showToast('error', 'Unavailable', 'This request is no longer pending'); return; }
    if (FireData.currentJob && FireData.currentJob.status !== 'complete') {
      showToast('warning', 'Already Responding', 'Complete your current response before accepting mutual aid', 5000);
      return;
    }
    const crew = FireData.crew;
    const ownStation = FireData.findStation(crew.lcrId);
    FireMutualAid.accept(requestId, ownStation, crew);
    const job = {
      id: rec.incidentId, type: rec.type, priority: rec.priority, location: rec.location,
      lat: rec.lat, lng: rec.lng, notes: rec.notes, status: 'accepted', acceptedAt: Date.now(),
      unitLat: ownStation.lat, unitLng: ownStation.lng, unitETA: null,
      isMutualAid: true, mutualAidRequestId: requestId,
      mutualAidOrigin: rec.originStationName,
    };
    FireData.setCurrentJob(job);
    showToast('success', 'Mutual Aid Accepted', `Responding to ${rec.originStationName} — ${rec.type}`, 6000);
    navigate('job');
    startRoute(ownStation, job);
  }

  function declineMutualAid(requestId) {
    FireMutualAid.decline(requestId);
    showToast('info', 'Request Declined', 'The requesting station has been notified');
    renderMutualAid();
  }

  function onIncomingMutualAid(rec) {
    const dot = document.getElementById('topbar-dot');
    if (dot) dot.classList.add('busy');
    showToast('error', '🤝 Mutual Aid Request', `${rec.originStationName} needs backup — ${rec.type} (${rec.distanceKm} km)`, 8000);
    if (currentScreen === 'aid') renderMutualAid();
  }

  function onMutualAidStatusChanged(rec) {
    if (rec.status === 'accepted') {
      showToast('success', '🤝 Backup Accepted', `${rec.acceptedByName} (${rec.targetStationName}) is responding`, 6000);
    } else if (rec.status === 'declined') {

    }

    if (currentScreen === 'job') renderJob();
  }

  function onMutualAidRecordUpdated(rec) {
    // Live position refresh for whichever side of this request is on screen.

    const isOriginViewingBackupUnit = !job.mutualAidRequestId && FireMutualAid.recordForIncident(job.id)?.id === rec.id;

    }
  }

  function refreshMutualAidTab() {
    const incoming = FireMutualAid.myIncoming();
    const badge = document.getElementById('aid-badge');
    if (badge) {
      badge.style.display = incoming.length ? 'inline-block' : 'none';
      badge.textContent = incoming.length || '';
    }
    if (currentScreen === 'aid') renderMutualAid();
  }

  function renderMutualAid() {
    const el = document.getElementById('screen-aid');
    if (!el) return;
    const incoming = FireMutualAid.myIncoming();
    const outgoing = FireMutualAid.myOutgoing();
    const statusColor = s => ({ pending:'var(--gold)', accepted:'var(--green)', declined:'var(--red)', cancelled:'var(--text-ghost)', completed:'var(--cyan)' }[s] || 'var(--text-muted)');

    el.innerHTML = `
      ${incoming.length ? `
      <div style="padding:14px 14px 0">
        <div style="font-size:0.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">📥 Incoming Requests</div>
      </div>
      ${incoming.map(r => `
        <div class="call-card" style="border-color:var(--cyan)">

          <div style="flex:1">
            <div style="font-size:0.8rem;font-weight:700">${r.targetStationName} <span style="font-weight:400;color:var(--text-ghost);font-size:0.68rem">${r.distanceKm} km</span></div>
            <div style="font-size:0.7rem;color:var(--text-muted)">${r.type} · ${r.status.toUpperCase()}${r.acceptedByName ? ' — ' + r.acceptedByName + (r.unitETA!=null ? ' · ETA ' + r.unitETA + ' min' : '') : ''}</div>
          </div>
          ${r.status === 'pending' ? `<button class="btn btn-ghost btn-sm" onclick="FireApp.cancelMutualAidRequest('${r.id}')">Cancel</button>` : ''}
        </div>`).join('') : `<div class="empty-state" style="padding:24px"><div style="font-size:0.78rem">No backup requests sent yet. Open an active response and tap "Request Mutual Aid" there.</div></div>`}
    `;
  }

  function renderJob() {
    const el = document.getElementById('screen-job');
    if (!el) return;
    const job = FireData.currentJob;
    if (!job) {
      el.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🗺</div><div style="font-weight:700">No active response</div></div>`;
      return;
    }
    el.innerHTML = `
      <div id="incident-map"></div>
      <div class="stat-row" style="margin-top:14px">
        <div class="stat-box"><div class="stat-val" id="stat-eta">${job.unitETA ?? '—'}</div><div class="stat-key">Min ETA</div></div>
        <div class="stat-box"><div class="stat-val" style="color:var(--red)">${(job.priority||'').toUpperCase()}</div><div class="stat-key">Priority</div></div>
        <div class="stat-box"><div class="stat-val" style="font-size:0.75rem;color:var(--cyan)" id="stat-status">${statusLabel(job.status)}</div><div class="stat-key">Status</div></div>
        <div class="stat-box"><div class="stat-val" style="font-size:0.7rem">${job.id}</div><div class="stat-key">Ref</div></div>
      </div>
      <div class="job-detail">
        ${job.isMutualAid ? `<div class="job-detail-row" style="color:var(--cyan);font-weight:700">🤝 Mutual Aid — responding for ${job.mutualAidOrigin}</div>` : ''}
        <div class="job-detail-row"><b>${job.type}</b></div>
        <div class="job-detail-row">📍 ${job.location}</div>
        <div class="job-detail-row">🧭 GPS: ${job.lat?.toFixed(5)}, ${job.lng?.toFixed(5)}</div>
        <div class="job-detail-row" id="live-line" style="color:var(--cyan)">${liveLine(job)}</div>
        ${job.civilianName ? `<div class="job-detail-row">👤 ${job.civilianName}${job.civilianPhone ? ' · ' + job.civilianPhone : ''}</div>` : ''}
        ${job.notes ? `<div class="job-detail-row">📝 ${job.notes}</div>` : ''}
        ${renderMutualAidStatusRow(job)}
      </div>
      ${!job.isMutualAid ? renderAidPicker() : ''}
      <div class="action-bar">
        ${!job.isMutualAid ? `<button class="btn btn-cyan" onclick="FireApp.toggleAidPicker()">🤝 ${aidPickerOpen ? 'Hide' : 'Request Mutual Aid'}</button>` : ''}
        ${job.status === 'accepted' ? `<button class="btn btn-primary btn-full" onclick="FireApp.setStatus('en_route')">🚨 Depart — En Route</button>` : ''}
        ${job.status === 'en_route' ? `<button class="btn btn-warning btn-full" onclick="FireApp.setStatus('on_scene')">📍 Mark On Scene</button>` : ''}
        ${job.status === 'on_scene' ? `<button class="btn btn-success btn-full" onclick="FireApp.setStatus('complete')">✅ Complete Call</button>` : ''}
      </div>`;
    setTimeout(initMap, 60);
  }

  function renderMutualAidStatusRow(job) {
    const outRec = !job.isMutualAid ? FireMutualAid.recordForIncident(job.id) : null;
    if (!outRec || outRec.status === 'cancelled') return '';
    if (outRec.status === 'pending') return `<div class="job-detail-row" style="color:var(--gold)">🤝 Backup requested from ${outRec.targetStationName} (${outRec.distanceKm} km) — awaiting response</div>`;
    if (outRec.status === 'accepted') return `<div class="job-detail-row" style="color:var(--green)">🤝 ${outRec.acceptedByName} from ${outRec.targetStationName} is responding${outRec.unitETA!=null ? ' · ETA ' + outRec.unitETA + ' min' : ''}</div>`;
    if (outRec.status === 'declined') return `<div class="job-detail-row" style="color:var(--red)">🤝 ${outRec.targetStationName} declined the backup request</div>`;
    if (outRec.status === 'completed') return `<div class="job-detail-row" style="color:var(--cyan)">🤝 Backup unit from ${outRec.targetStationName} completed its response</div>`;
    return '';
  }

  function renderAidPicker() {
    if (!aidPickerOpen) return '';
    const crew = FireData.crew;
    const stations = FireData.nearbyStations(crew.lcrId).slice(0, 6);
    return `
      <div style="margin:0 14px 10px;background:var(--bg-raised);border:1px solid var(--border-mid);border-radius:var(--r-md);padding:10px">
        <div style="font-size:0.72rem;color:var(--text-muted);margin-bottom:8px">Nearest other-jurisdiction fire stations, by real distance:</div>
        ${stations.map(s => `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border-base)">
            <div><div style="font-size:0.8rem;font-weight:700">${s.name}</div><div style="font-size:0.68rem;color:var(--text-ghost)">${s.distanceKm.toFixed(1)} km away</div></div>
            <button class="btn btn-cyan btn-sm" onclick="FireApp.requestMutualAid('${s.id}')">Send Request</button>
          </div>`).join('')}
      </div>`;
  }

  function statusLabel(s) {
    return { accepted:'Accepted', en_route:'En Route', on_scene:'On Scene', complete:'Complete' }[s] || s;
  }

  function liveLine(job) {
    if (job.status !== 'en_route') return job.status === 'accepted' ? 'Tap Depart to start sharing your live position and ETA.' : '';
    if (!lastFix) return '⏳ Waiting for a GPS fix. Your position is not being shared yet.';
    return '🛰 Live position shared every few seconds' + (job.etaSrc ? ' · ETA by ' + (job.etaSrc === 'road' ? 'road route' : 'straight line (road data unavailable)') : '') + (job.etaKm != null ? ' · about ' + job.etaKm.toFixed(1) + ' km to go' : '');
  }
  function updateStatBar() {
    const eta = document.getElementById('stat-eta'), j = FireData.currentJob;
    if (eta && j) eta.textContent = j.unitETA ?? '—';
    const ll = document.getElementById('live-line'); if (ll && j) ll.textContent = liveLine(j);
  }

  let backupMarker = null;

  function initMap() {
    const el = document.getElementById('incident-map');
    if (!el || typeof L === 'undefined') return;
    const job = FireData.currentJob;
    if (!job) return;
    if (map) { try { map.remove(); } catch(e){} map = null; backupMarker = null; }
    const center = [job.unitLat || job.lat, job.unitLng || job.lng];
    map = L.map('incident-map', { zoomControl:true, attributionControl:false }).setView(center, 13);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom:19 }).addTo(map);
    incMarker = L.marker([job.lat, job.lng], { icon: L.divIcon({
      html:'<div style="font-size:22px">🔥</div>', className:'', iconSize:[26,26], iconAnchor:[13,13] }) })
      .addTo(map).bindPopup(job.type);
    unitMarker = L.marker([job.unitLat || job.lat, job.unitLng || job.lng], { icon: L.divIcon({
      html:'<div style="font-size:22px">🚒</div>', className:'', iconSize:[26,26], iconAnchor:[13,13] }) })
      .addTo(map).bindPopup(FireData.crew.name);
    routeLine = L.polyline(routeCoords.length ? routeCoords : [[job.lat,job.lng]], { color:'#ef4444', weight:3, dashArray:'8 6' }).addTo(map);
    const bounds = [[job.lat,job.lng],[job.unitLat||job.lat, job.unitLng||job.lng]];

    // Live backup-unit marker: shown on the origin's map once another
    // jurisdiction accepts, and on the responder's own map (their own unit,
    // already drawn above as unitMarker, so only draw this for the origin).
    const aidRec = !job.isMutualAid ? FireMutualAid.recordForIncident(job.id) : null;
    if (aidRec && aidRec.status === 'accepted' && aidRec.unitLat != null) {
      backupMarker = L.marker([aidRec.unitLat, aidRec.unitLng], { icon: L.divIcon({
        html:'<div style="font-size:22px">🚒🤝</div>', className:'', iconSize:[30,26], iconAnchor:[15,13] }) })
        .addTo(map).bindPopup(`${aidRec.acceptedByName} — ${aidRec.targetStationName} (mutual aid)`);
      bounds.push([aidRec.unitLat, aidRec.unitLng]);
    }
    map.fitBounds(L.latLngBounds(bounds), { padding:[40,40] });
  }

  function updateBackupMarker(rec) {
    if (!map || rec.unitLat == null) return;
    if (!backupMarker) {
      backupMarker = L.marker([rec.unitLat, rec.unitLng], { icon: L.divIcon({
        html:'<div style="font-size:22px">🚒🤝</div>', className:'', iconSize:[30,26], iconAnchor:[15,13] }) })
        .addTo(map).bindPopup(`${rec.acceptedByName || ''} — ${rec.targetStationName || ''} (mutual aid)`);
    } else {
      backupMarker.setLatLng([rec.unitLat, rec.unitLng]);
    }
  }

  return {
    showSignup, showLogin, doLogin, doSignup, endShift, navigate,
    onNewCall, acceptCall, setStatus, showToast,
    toggleAidPicker, requestMutualAid, cancelMutualAidRequest,
    acceptMutualAid, declineMutualAid,
    onIncomingMutualAid, onMutualAidStatusChanged, onMutualAidRecordUpdated, refreshMutualAidTab,
  };
})();

document.addEventListener('DOMContentLoaded', () => {
  ['login-name','login-pass'].forEach(id => {
    const elm = document.getElementById(id);
    if (elm) elm.addEventListener('keydown', e => { if (e.key === 'Enter') FireApp.doLogin(); });
  });
});
</script>

<script>
/* Crew password dialog: change your own password, and a forced change after a control room reset. */
const CrewPw = (() => {
  let done = null;
  function close() { const o = document.getElementById('crewpw-overlay'); if (o) o.remove(); if (done) { const d = done; done = null; d(true); } }
  function open(opts) {
    opts = opts || {};
    return new Promise((resolve) => {
      done = resolve;
      const old = document.getElementById('crewpw-overlay'); if (old) old.remove();
      const o = document.createElement('div'); o.id = 'crewpw-overlay';
      o.style.cssText = 'position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:16px';
      const inp = 'width:100%;box-sizing:border-box;padding:11px 12px;margin-top:6px;border-radius:8px;border:1px solid #3a4a5c;background:#0b1118;color:#fff;font-size:15px';
      o.innerHTML = '<div style="width:100%;max-width:380px;background:#101a24;border:1px solid #2c3d4f;border-radius:14px;padding:18px;color:#e6eef6;font-family:system-ui,sans-serif">'
        + '<div style="font-size:17px;font-weight:700">🔑 ' + (opts.forced ? 'Choose your own password' : 'Change password') + '</div>'
        + '<div style="font-size:13px;color:#9db0c3;margin:6px 0 10px;line-height:1.45">' + (opts.forced ? 'Your control room gave you a temporary password. Choose a new one that only you know before you continue.' : 'You will stay signed in on this device; other devices will be signed out.') + '</div>'
        + (opts.current ? '' : '<label style="font-size:12px;color:#9db0c3">Current password<input id="crewpw-cur" type="password" autocomplete="current-password" style="' + inp + '"></label>')
        + '<label style="font-size:12px;color:#9db0c3;display:block;margin-top:8px">New password (at least 8 characters)<input id="crewpw-new" type="password" autocomplete="new-password" style="' + inp + '"></label>'
        + '<label style="font-size:12px;color:#9db0c3;display:block;margin-top:8px">Repeat new password<input id="crewpw-new2" type="password" autocomplete="new-password" style="' + inp + '"></label>'
        + '<div id="crewpw-err" style="color:#ff8a80;font-size:13px;min-height:18px;margin-top:8px"></div>'
        + '<div style="display:flex;gap:8px;margin-top:6px">' + (opts.forced ? '' : '<button id="crewpw-cancel" style="flex:1;padding:11px;border-radius:8px;border:1px solid #3a4a5c;background:transparent;color:#e6eef6;font-size:14px">Cancel</button>')
        + '<button id="crewpw-save" style="flex:2;padding:11px;border-radius:8px;border:0;background:#1f9d6a;color:#fff;font-weight:700;font-size:14px">Save password</button></div></div>';
      document.body.appendChild(o);
      const err = (t) => { const e = document.getElementById('crewpw-err'); if (e) e.textContent = t || ''; };
      const cancel = document.getElementById('crewpw-cancel'); if (cancel) cancel.onclick = () => { done = null; o.remove(); resolve(false); };
      document.getElementById('crewpw-save').onclick = async () => {
        const cur = opts.current || (document.getElementById('crewpw-cur') || {}).value || '', n1 = document.getElementById('crewpw-new').value, n2 = document.getElementById('crewpw-new2').value;
        if (!cur) return err('Enter your current password');
        if (n1.length < 8) return err('The new password needs at least 8 characters');
        if (n1 !== n2) return err('The two new passwords do not match');
        if (n1 === cur) return err('Choose a password different from the current one');
        const b = document.getElementById('crewpw-save'); b.disabled = true; b.textContent = 'Saving…';
        try {
          const r = await fetch((GeamsSync.base || '') + '/api/unit/password', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (GeamsSync.token || '') }, body: JSON.stringify({ current: cur, password: n1 }) });
          let j = {}; try { j = await r.json(); } catch (e) {}
          if (!r.ok) { err(j.error || 'The server refused the change'); b.disabled = false; b.textContent = 'Save password'; return; }
          if (j.token) GeamsSync.setToken(j.token);
          window.__geamsMustChange = false;
          try { if (typeof showToast === 'function') showToast('success', 'Password changed', 'Use the new password next time you sign in', 4000); } catch (e) {}
          close();
        } catch (e) { err('Could not reach the server. Check your connection.'); b.disabled = false; b.textContent = 'Save password'; }
      };
      setTimeout(() => { const f = document.getElementById(opts.current ? 'crewpw-new' : 'crewpw-cur'); if (f) f.focus(); }, 50);
    });
  }
  return { open };
})();
</script>

<script>
/* Feedback: a small form any signed-in person can use. Goes to HQ only. */
const Feedback = (() => {
  const e2 = (x) => String(x == null ? '' : x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function open(app, isCivilian) {
    const old = document.getElementById('fb-overlay'); if (old) old.remove();
    const o = document.createElement('div'); o.id = 'fb-overlay';
    o.style.cssText = 'position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:16px';
    const inp = 'width:100%;box-sizing:border-box;padding:10px 12px;margin-top:6px;border-radius:8px;border:1px solid #3a4a5c;background:#0b1118;color:#fff;font-size:15px;font-family:inherit';
    o.innerHTML = '<div style="width:100%;max-width:400px;background:#101a24;border:1px solid #2c3d4f;border-radius:14px;padding:18px;color:#e6eef6;font-family:system-ui,sans-serif">'
      + '<div style="font-size:17px;font-weight:700">💬 Send feedback</div>'
      + '<div style="font-size:13px;color:#9db0c3;margin:6px 0 10px;line-height:1.45">Tell the GEAMS team what is wrong, what could be better, or what works. Do <b>not</b> use this for an emergency: call 112.</div>'
      + '<select id="fb-kind" style="' + inp + '"><option value="problem">Something is wrong</option><option value="idea">An idea</option><option value="praise">Something works well</option></select>'
      + '<textarea id="fb-text" rows="5" maxlength="1000" placeholder="What happened? What were you doing?" style="' + inp + '"></textarea>'
      + (isCivilian ? '<label style="display:flex;gap:8px;font-size:12.5px;color:#9db0c3;margin-top:8px;align-items:flex-start"><input type="checkbox" id="fb-ok" style="margin-top:2px"><span>You may contact me about this. Your feedback is anonymous unless you tick this.</span></label><input id="fb-contact" placeholder="Phone number (only if ticked)" style="' + inp + '">' : '<div style="font-size:12px;color:#9db0c3;margin-top:8px">Staff feedback shows your sign-in name to HQ.</div>')
      + '<div id="fb-err" style="color:#ff8a80;font-size:13px;min-height:18px;margin-top:6px"></div>'
      + '<div style="display:flex;gap:8px"><button id="fb-cancel" style="flex:1;padding:11px;border-radius:8px;border:1px solid #3a4a5c;background:transparent;color:#cfd9e3">Cancel</button><button id="fb-send" style="flex:2;padding:11px;border-radius:8px;border:0;background:#1f9d6a;color:#fff;font-weight:700">Send</button></div></div>';
    document.body.appendChild(o);
    const err = (t) => { document.getElementById('fb-err').textContent = t || ''; };
    document.getElementById('fb-cancel').onclick = () => o.remove();
    document.getElementById('fb-send').onclick = async () => {
      const text = document.getElementById('fb-text').value.trim(); if (text.length < 5) return err('Please write a few words');
      const btn = document.getElementById('fb-send'); btn.disabled = true; btn.textContent = 'Sending…';
      try {
        const body = { kind: document.getElementById('fb-kind').value, text, app: app + ' ' + (window.GEAMS_BUILD || ''), contactOk: isCivilian ? document.getElementById('fb-ok').checked : false, contact: isCivilian ? document.getElementById('fb-contact').value : '' };
        const r = await fetch((GeamsSync.base || '') + '/api/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (GeamsSync.token || '') }, body: JSON.stringify(body) });
        let j = {}; try { j = await r.json(); } catch (e) {}
        if (!r.ok) { err(j.error || 'Not sent'); btn.disabled = false; btn.textContent = 'Send'; return; }
        o.innerHTML = '<div style="background:#101a24;border:1px solid #2c3d4f;border-radius:14px;padding:22px;color:#e6eef6;font-family:system-ui,sans-serif;max-width:340px;text-align:center"><div style="font-size:30px">✅</div><div style="font-weight:700;margin:6px 0">Thank you, sent to HQ</div><div style="font-size:12.5px;color:#9db0c3">Reference ' + e2(j.id) + '</div><button id="fb-done" style="margin-top:12px;padding:10px 24px;border-radius:8px;border:0;background:#1f9d6a;color:#fff;font-weight:700">Close</button></div>';
        document.getElementById('fb-done').onclick = () => o.remove();
      } catch (e) { err('Could not reach the server. Try again when you have a connection.'); btn.disabled = false; btn.textContent = 'Send'; }
    };
  }
  return { open };
})();
</script>
